name: Bug report
description: Report a reproducible behavior problem.
body:
  - type: markdown
    attributes:
      value: Do not include secrets or private source. Use SECURITY.md for sensitive reports.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, Go version, server version, and language-pack version.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Synthetic project layout, exact tool arguments, and commands.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: text
